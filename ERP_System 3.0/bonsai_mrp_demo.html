<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bonsai-style MRP Demo</title>
  <style>
    :root{--nav:#111827;--ink:#142033;--muted:#667085;--line:#e5eaf1;--blue:#2563eb;--bg:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}
    .shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:var(--nav);color:#d8e1ef}.brand{padding:0 10px 24px;font-size:20px;font-weight:900;color:#fff}.brand small{display:block;margin-top:4px;color:#7f8ca3;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.label{margin:16px 10px 7px;color:#78869c;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:#c9d4e5;text-align:left;font-weight:700;cursor:pointer}.nav button:hover{background:#1d2737;color:#fff}.nav button.active{background:#2563eb;color:#fff}.dot{width:7px;height:7px;border:2px solid currentColor;border-radius:50%}
    main{min-width:0;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}h1{margin:3px 0;font-size:27px}.live{padding:7px 10px;border:1px solid #bbf7d0;border-radius:99px;background:#f0fdf4;color:#15803d;font-size:11px;font-weight:900}
    .search-wrap{position:relative;margin-bottom:18px}.search{width:100%;height:50px;padding:0 16px;border:1px solid #d6deea;border-radius:12px;outline:0;background:#fff;box-shadow:0 5px 16px #17203308}.search:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #2563eb18}.suggest{position:absolute;z-index:5;top:55px;left:0;right:0;display:none;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 16px 32px #1018281f;overflow:hidden}.suggest.show{display:block}.suggest button{display:grid;grid-template-columns:1fr auto auto;gap:16px;width:100%;padding:12px 14px;border:0;border-top:1px solid #edf1f6;background:#fff;text-align:left;cursor:pointer}.suggest button:first-child{border-top:0}.suggest button:hover{background:#f7faff}.suggest strong{font-size:13px}.suggest span{color:var(--muted);font-size:12px}.tag{padding:3px 7px;border-radius:99px!important;background:#eaf1ff;color:#1d4ed8!important;font-size:9px!important;font-weight:900}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:12px;margin-bottom:18px}.metric,.panel{border:1px solid var(--line);border-radius:13px;background:#fff}.metric{padding:16px}.metric span{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.metric strong{display:block;margin:7px 0 2px;font-size:26px}.metric small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.7fr);gap:16px}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel h2{margin:0;font-size:14px}.filter{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;font-weight:700}.table{width:100%;border-collapse:collapse}.table th{padding:9px 7px;color:var(--muted);font-size:9px;letter-spacing:.08em;text-align:left;text-transform:uppercase}.table td{padding:11px 7px;border-top:1px solid #edf1f5;font-size:12px}.status{display:inline-block;padding:4px 7px;border-radius:99px;font-size:9px;font-weight:900}.ready{background:#e8f8ef;color:#167442}.short{background:#ffeded;color:#b42318}.wait{background:#fff4d9;color:#946200}.action{padding:12px 0;border-top:1px solid #edf1f5}.action:first-of-type{border-top:0}.action strong{display:block;font-size:12px}.action span{color:var(--muted);font-size:11px}.empty{padding:50px 15px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.nav{grid-template-columns:repeat(2,1fr)}main{padding:18px}.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side"><div class="brand">NTA MRP<small>Operations system</small></div><div class="label">Workspace</div><nav class="nav"><button class="active" data-view="Overview"><span class="dot"></span>Overview</button><button data-view="Quotations"><span class="dot"></span>Quotations</button><button data-view="Inventory"><span class="dot"></span>Inventory</button><button data-view="Item Info"><span class="dot"></span>Item Info</button><button data-view="Production"><span class="dot"></span>Production</button></nav></aside>
    <main><header class="top"><div><div class="eyebrow">Reactive workspace demo</div><h1 id="title">Overview</h1></div><div class="live">● DATA LIVE</div></header>
      <div class="search-wrap"><input id="search" class="search" placeholder="Search SO, item, or customer…" autocomplete="off"><div id="suggest" class="suggest"></div></div>
      <div id="content"></div>
    </main>
  </div>
  <script>
    const suggestions=[
      {label:'SO-10482',detail:'Atlas Systems · Ship 2026-08-05',type:'SO'},
      {label:'SO-10477',detail:'Northstar Robotics · Ship 2026-08-06',type:'SO'},
      {label:'NRU-161V-AWP',detail:'On Hand: 24',type:'ITEM'},
      {label:'GC-Jetson-NX16G-Orin-Nvidia',detail:'On Hand: 8',type:'ITEM'},
      {label:'Atlas Systems',detail:'12 open orders',type:'CUSTOMER'}
    ];
    const overview=`<div class="metrics"><div class="metric"><span>Open work</span><strong>44</strong><small>Needs lead time</small></div><div class="metric"><span>Short items</span><strong>18</strong><small>6 critical</small></div><div class="metric"><span>Ready orders</span><strong>27</strong><small>Available to build</small></div><div class="metric"><span>Due this week</span><strong>12</strong><small>3 need action</small></div></div><div class="layout"><section class="panel"><div class="panel-head"><h2>Priority orders</h2><button class="filter">Due first ▾</button></div><table class="table"><thead><tr><th>Sales order</th><th>Customer</th><th>Ship date</th><th>Status</th></tr></thead><tbody><tr><td><b>SO-10482</b></td><td>Atlas Systems</td><td>Aug 05</td><td><span class="status short">SHORT</span></td></tr><tr><td><b>SO-10477</b></td><td>Northstar</td><td>Aug 06</td><td><span class="status wait">WAITING</span></td></tr><tr><td><b>SO-10469</b></td><td>Vertex Labs</td><td>Aug 08</td><td><span class="status ready">READY</span></td></tr></tbody></table></section><section class="panel"><div class="panel-head"><h2>Needs attention</h2></div><div class="action"><strong>6 critical shortages</strong><span>Review purchase coverage</span></div><div class="action"><strong>4 orders missing LT</strong><span>Assign committed dates</span></div><div class="action"><strong>2 schedule conflicts</strong><span>Resolve line capacity</span></div></section></div>`;
    const content=document.getElementById('content'),title=document.getElementById('title'); content.innerHTML=overview;
    document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');title.textContent=btn.dataset.view;content.innerHTML=btn.dataset.view==='Overview'?overview:`<section class="panel empty"><h2>${btn.dataset.view}</h2><p>Only this right-side workspace changed. The navigation and search stayed mounted.</p></section>`});
    const input=document.getElementById('search'),box=document.getElementById('suggest'); input.oninput=()=>{const q=input.value.trim().toLowerCase();const rows=q?suggestions.filter(x=>(x.label+' '+x.detail).toLowerCase().includes(q)):[];box.innerHTML=rows.map(x=>`<button><strong>${x.label}</strong><span>${x.detail}</span><span class="tag">${x.type}</span></button>`).join('');box.classList.toggle('show',rows.length>0)};document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))box.classList.remove('show')});
  </script>
</body>
</html>
