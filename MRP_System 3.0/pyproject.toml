[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrp-system"
version = "3.0.0"
description = "MRP backend package for ETL, ledger, ATP, and query workflows."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrp_system*"]

[tool.setuptools.package-data]
"mrp_system.ledger" = ["*.sql"]
